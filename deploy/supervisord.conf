[supervisord]
nodaemon=true
pidfile=/tmp/smsbot-supervisor.pid
logfile=/dev/null
logfile_maxbytes=0

[program:api]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --no-proxy-headers
directory=/app/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=30

[program:worker]
command=python -m app.worker
directory=/app/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=120

[program:frontend]
command=nginx -c /app/deploy/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
